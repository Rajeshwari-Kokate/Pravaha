<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRAVAHA: Urban Flood Intelligence and Drainage Investigation</title>
    <meta name="description" content="PRAVAHA models rainfall scenarios, drainage constraints, and potentially affected infrastructure to support urban flood investigation." />
    <meta name="theme-color" content="#0f172a" />
    <!-- Prevent theme flash before first paint -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('pravaha-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#090d16] text-slate-900 dark:text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
